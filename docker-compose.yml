# Local/full-stack deployment: PostgreSQL + Spring Boot API + web app (nginx).
# Usage: cp .env.example .env  (fill in secrets)  &&  docker compose up --build
# Web: http://localhost:8088   API docs: http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: explainly
      POSTGRES_USER: ${DATABASE_USERNAME:-explainly}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-explainly}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-explainly} -d explainly"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/explainly
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:8088}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:5173}
      OAUTH_ALLOWED_REDIRECT_PREFIXES: ${OAUTH_ALLOWED_REDIRECT_PREFIXES:-http://localhost:8088,explainly://}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - backend
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  pgdata:
